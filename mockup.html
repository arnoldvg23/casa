<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casa · Mòbil</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    /* Marc de mòbil per veure l'app al PC. L'app va dins d'un iframe del mateix
       origen, així que comparteix sessió de Firebase i dades amb la pestanya normal. */
    :root {
      --bg: #e9e7e3;
      --bg-2: #d9d6d0;
      --ink: #2b2825;
      --muted: #6f6a64;
      --chip: rgba(255, 255, 255, .7);
      --chip-border: rgba(0, 0, 0, .08);
      --frame: #1c1b1a;
      --frame-edge: #3a3835;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121110;
        --bg-2: #1f1d1b;
        --ink: #ece9e4;
        --muted: #9a948c;
        --chip: rgba(255, 255, 255, .06);
        --chip-border: rgba(255, 255, 255, .1);
        --frame: #0b0b0a;
        --frame-edge: #45423e;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(120% 90% at 50% 0%, var(--bg-2), var(--bg));
      color: var(--ink);
      font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px 12px 0;
    }
    .toolbar select, .toolbar button {
      font: inherit;
      color: inherit;
      background: var(--chip);
      border: 1px solid var(--chip-border);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .toolbar button:hover, .toolbar select:hover { border-color: var(--muted); }

    .stage {
      flex: 1;
      width: 100%;
      min-height: 0;
      position: relative;
    }
    /* El mòbil es dibuixa a mida real i després s'escala perquè hi càpiga. */
    .phone {
      position: relative;
      padding: var(--bezel);
      border-radius: var(--outer-r);
      background: var(--frame);
      box-shadow:
        0 0 0 2px var(--frame-edge),
        0 0 0 3px #000,
        0 30px 80px rgba(0, 0, 0, .35),
        0 8px 20px rgba(0, 0, 0, .25);
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      transform-origin: center center;
    }
    .phone::before, .phone::after {
      /* botons laterals */
      content: "";
      position: absolute;
      width: 4px;
      background: var(--frame-edge);
      border-radius: 2px;
    }
    .phone::before { left: -5px; top: 22%; height: 9%; box-shadow: 0 calc(var(--h) * .11) 0 var(--frame-edge); }
    .phone::after { right: -5px; top: 28%; height: 13%; }

    .screen {
      position: relative;
      width: var(--w);
      height: var(--h);
      border-radius: var(--inner-r);
      overflow: hidden;
      background: var(--app-bg, #f6f5f3);
      display: flex;
      flex-direction: column;
    }
    .statusbar {
      flex: none;
      height: var(--status-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--status-pad);
      font: 600 15px/1 -apple-system, "SF Pro Text", system-ui, sans-serif;
      color: var(--app-ink, #1a1816);
      position: relative;
      z-index: 2;
    }
    .statusbar .icons { display: flex; gap: 5px; align-items: center; }
    .statusbar svg { display: block; fill: currentColor; }
    .island {
      position: absolute;
      left: 50%;
      top: 11px;
      transform: translateX(-50%);
      width: 122px;
      height: 35px;
      border-radius: 20px;
      background: #000;
    }
    .punch {
      position: absolute;
      left: 50%;
      top: 10px;
      transform: translateX(-50%);
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #000;
    }
    iframe {
      flex: 1;
      width: 100%;
      border: 0;
      display: block;
      background: transparent;
    }
    .homebar {
      flex: none;
      height: var(--home-h);
      display: grid;
      place-items: center;
    }
    .homebar span {
      width: 134px;
      height: 5px;
      border-radius: 3px;
      background: var(--app-ink, #1a1816);
      opacity: .85;
    }
    .homebar.android span { width: 108px; height: 4px; opacity: .5; }

    /* Botó de l'iPhone SE */
    .home-button {
      position: absolute;
      left: 50%;
      bottom: calc((var(--bezel-bottom) - 54px) / 2);
      transform: translateX(-50%);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid var(--frame-edge);
    }
    .speaker {
      position: absolute;
      left: 50%;
      top: calc((var(--bezel-top) - 6px) / 2);
      transform: translateX(-50%);
      width: 60px;
      height: 6px;
      border-radius: 3px;
      background: var(--frame-edge);
    }
    .phone.classic { padding: var(--bezel-top) 14px var(--bezel-bottom); }

    .hint {
      color: var(--muted);
      font-size: 12px;
      padding: 0 12px 10px;
      text-align: center;
    }
    body.popup .toolbar, body.popup .hint { display: none; }
  </style>
</head>
<body>
  <div class="toolbar">
    <select id="device" aria-label="Model de mòbil"></select>
    <button type="button" id="reload" title="Recarrega l'app">↻ Recarrega</button>
    <button type="button" id="popup" title="Obre el mòbil en una finestra a part">⧉ Finestra a part</button>
  </div>
  <div class="stage"><div class="phone" id="phone"><div class="screen" id="screen"></div></div></div>
  <div class="hint">És la teva app de veritat, amb el teu usuari i les teves dades.</div>

  <script>
    const DEVICES = {
      iphone15: { name: 'iPhone 15', w: 393, h: 852, bezel: 12, outerR: 60, innerR: 48, status: 54, statusPad: 34, home: 34, notch: 'island' },
      iphone15max: { name: 'iPhone 15 Pro Max', w: 430, h: 932, bezel: 12, outerR: 64, innerR: 52, status: 54, statusPad: 36, home: 34, notch: 'island' },
      iphonese: { name: 'iPhone SE', w: 375, h: 667, bezel: 0, outerR: 54, innerR: 2, status: 20, statusPad: 8, home: 0, notch: 'classic' },
      pixel8: { name: 'Pixel 8', w: 412, h: 915, bezel: 11, outerR: 46, innerR: 36, status: 36, statusPad: 22, home: 22, notch: 'punch' },
      galaxy: { name: 'Galaxy S24', w: 360, h: 780, bezel: 9, outerR: 44, innerR: 36, status: 32, statusPad: 20, home: 20, notch: 'punch' },
    };
    const STORE_KEY = 'casa-mockup-device';
    const params = new URLSearchParams(location.search);
    const isPopup = params.has('finestra');
    if (isPopup) document.body.classList.add('popup');

    function load(key) { try { return localStorage.getItem(key); } catch { return null; } }
    function save(key, value) { try { localStorage.setItem(key, value); } catch {} }

    let deviceId = params.get('d') || load(STORE_KEY) || 'iphone15';
    if (!DEVICES[deviceId]) deviceId = 'iphone15';

    const select = document.getElementById('device');
    for (const [id, d] of Object.entries(DEVICES)) select.add(new Option(`${d.name} · ${d.w}×${d.h}`, id));
    select.value = deviceId;

    const phone = document.getElementById('phone');
    const screen = document.getElementById('screen');

    // L'app es carrega un sol cop: canviar de model només canvia la mida del marc,
    // així no es perd on eres.
    const frame = document.createElement('iframe');
    frame.title = 'Casa';
    frame.src = './';
    frame.allow = 'clipboard-write; web-share; camera';

    const STATUS_ICONS = `
      <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4 10.4 10.4 0 0 0 .8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4a6.7 6.7 0 0 0-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3zm0 3.6c-.6 0-1.1.2-1.5.6L8 11.6l1.5-1.6c-.4-.4-.9-.6-1.5-.6z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" opacity=".4"/></svg>`;

    function build() {
      const d = DEVICES[deviceId];
      const s = phone.style;
      s.setProperty('--w', d.w + 'px');
      s.setProperty('--h', d.h + 'px');
      s.setProperty('--bezel', d.bezel + 'px');
      s.setProperty('--outer-r', d.outerR + 'px');
      s.setProperty('--inner-r', d.innerR + 'px');
      s.setProperty('--status-h', d.status + 'px');
      s.setProperty('--status-pad', d.statusPad + 'px');
      s.setProperty('--home-h', d.home + 'px');
      s.setProperty('--bezel-top', '96px');
      s.setProperty('--bezel-bottom', '96px');
      phone.classList.toggle('classic', d.notch === 'classic');
      phone.querySelectorAll('.home-button, .speaker').forEach((el) => el.remove());

      const notch = d.notch === 'island' ? '<div class="island"></div>' : d.notch === 'punch' ? '<div class="punch"></div>' : '';
      const small = d.notch === 'classic';
      const status = document.createElement('div');
      status.className = 'statusbar';
      status.style.fontSize = small ? '12px' : '';
      status.innerHTML = `<span class="clock"></span>${notch}<span class="icons">${STATUS_ICONS}</span>`;
      const home = document.createElement('div');
      home.className = 'homebar' + (d.notch === 'punch' ? ' android' : '');
      if (d.home) home.innerHTML = '<span></span>';

      screen.replaceChildren(status, frame, home);
      if (d.notch === 'classic') {
        phone.insertAdjacentHTML('beforeend', '<div class="speaker"></div><div class="home-button"></div>');
      }
      tick();
      fit();
    }

    function tick() {
      const now = new Date();
      const text = now.toLocaleTimeString('ca-ES', { hour: '2-digit', minute: '2-digit' });
      screen.querySelectorAll('.clock').forEach((el) => { el.textContent = text; });
    }

    function fit() {
      const rect = phone.getBoundingClientRect();
      // getBoundingClientRect ja porta l'escala actual: la traiem per tenir la mida real.
      const current = Number(phone.dataset.scale || 1);
      const w = rect.width / current;
      const h = rect.height / current;
      const stage = document.querySelector('.stage').getBoundingClientRect();
      const margin = isPopup ? 12 : 28;
      const scale = Math.min(1, (stage.width - margin) / w, (stage.height - margin) / h);
      phone.dataset.scale = scale;
      phone.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    // Pinta la barra d'estat amb el color de fons de l'app (clar o fosc).
    function syncColors() {
      try {
        const doc = frame.contentDocument;
        if (!doc || !doc.body) return;
        const bg = getComputedStyle(doc.body).backgroundColor;
        const ink = getComputedStyle(doc.body).color;
        if (bg && bg !== 'rgba(0, 0, 0, 0)') screen.style.setProperty('--app-bg', bg);
        if (ink) screen.style.setProperty('--app-ink', ink);
      } catch {}
    }
    frame.addEventListener('load', () => {
      syncColors();
      // Si l'app canvia de pantalla sense recarregar, tornem a mirar els colors.
      setTimeout(syncColors, 600);
    });
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(syncColors, 100));

    select.addEventListener('change', () => {
      deviceId = select.value;
      save(STORE_KEY, deviceId);
      build();
    });
    document.getElementById('reload').addEventListener('click', () => frame.contentWindow.location.reload());
    document.getElementById('popup').addEventListener('click', () => {
      const d = DEVICES[deviceId];
      const extra = d.notch === 'classic' ? 200 : d.bezel * 2;
      const width = Math.round(d.w + extra + 40);
      const height = Math.round(d.h + extra + 40 + 60);
      const url = new URL(location.href);
      url.search = `?finestra&d=${deviceId}`;
      window.open(url.href, 'casa-mobil', `popup,width=${width},height=${height}`);
    });
    addEventListener('resize', fit);
    setInterval(tick, 15000);

    build();
  </script>
</body>
</html>
